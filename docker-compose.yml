services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: tredge
      POSTGRES_PASSWORD: tredge
      POSTGRES_DB: tredge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tredge -d tredge']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: tredge
      MINIO_ROOT_PASSWORD: change-me-long-enough
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/ready']
      interval: 5s
      timeout: 5s
      retries: 12
  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
  minio_data:
